<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Morse Code Translator</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>Morse Code Translator</h1>
  </header>

  <label for="text">Text</label>
  <textarea id="text" rows="3" placeholder="Type to encode…" autocomplete="off"></textarea>

  <label for="morse">Morse code</label>
  <textarea id="morse" rows="3" placeholder="… --- …  paste to decode…" autocomplete="off"></textarea>

  <div id="warning" hidden></div>

  <div class="actions">
    <button id="swap" title="Swap directions">&#8645; Swap</button>
    <button id="play" title="Play as audio (600 Hz, 15 WPM)">&#9654; Play</button>
    <button id="stop" title="Stop playback">&#9632; Stop</button>
    <button id="clear" title="Clear both fields">Clear</button>
  </div>

  <footer>
    <a href="https://morsetranslator.me/" target="_blank" rel="noopener">
      Audio decoder, charts &amp; more at morsetranslator.me &#8599;
    </a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
